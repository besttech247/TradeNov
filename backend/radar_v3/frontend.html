<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Radar V3</title>
<style>*{box-sizing:border-box}body{margin:0;background:#070d18;color:#e9eff8;font:14px Arial}.head{height:68px;border-bottom:1px solid #1e2b40;padding:0 24px;display:flex;align-items:center}.logo{font-size:22px;font-weight:800}.live{margin-left:auto;color:#5ee39a}.wrap{max-width:1700px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card,.panel{background:#0e1727;border:1px solid #1e2d45;border-radius:12px}.card{padding:16px}.label{color:#8194b1;font-size:11px}.value{font-size:23px;font-weight:800;margin-top:8px}.panel{margin-top:16px;overflow:hidden}.ph{padding:15px;border-bottom:1px solid #1e2b40;font-weight:bold}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:11px;border-bottom:1px solid #18243a;text-align:center}th{font-size:11px;color:#8194b1;background:#101b2d}tr:hover{background:#122037;cursor:pointer}.long{color:#5ee39a}.short{color:#ff6b82}.detail{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;padding:16px}.chart{height:310px;background:#09111f;border-radius:10px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:#09111f;border:1px solid #1b2940;border-radius:9px;padding:11px}.metric b{display:block;margin-top:5px}.reason{color:#aab8cc;margin-top:12px;line-height:1.8}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}}</style></head><body>
<div class="head"><div class="logo">CRYPTO INTRADAY RADAR <span style="color:#708cff">V3</span></div><div class="live">● <span id="conn">CONNECTING</span></div></div>
<div class="wrap"><div class="cards"><div class="card"><div class="label">MARKET REGIME</div><div class="value" id="reg">—</div></div><div class="card"><div class="label">MARKETS</div><div class="value" id="m">—</div></div><div class="card"><div class="label">TOP SCORE</div><div class="value" id="sc">—</div></div><div class="card"><div class="label">TOP SYMBOL</div><div class="value" id="ts">—</div></div><div class="card"><div class="label">UPDATED</div><div class="value" id="tm">—</div></div></div>
<div class="panel"><div class="ph">TOP INTRADAY OPPORTUNITIES</div><div style="overflow:auto"><table><thead><tr><th>SYMBOL</th><th>SIGNAL</th><th>SCORE</th><th>PRICE</th><th>5M%</th><th>RSI</th><th>RVOL</th><th>BUY%</th><th>CVD</th><th>BOOK</th><th>SPREAD</th><th>ENTRY</th><th>SL</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="panel"><div class="ph" id="title">SELECT A MARKET</div><div class="detail"><div class="chart"></div><div><div class="metrics" id="metrics"></div><div class="reason" id="reason"></div></div></div></div></div>
<script>
let data=[];const $=x=>document.getElementById(x),n=(x,d=3)=>Number(x).toFixed(d);
function render(r){data=r;$("rows").innerHTML=r.map((x,i)=>`<tr onclick="sel(${i})"><td><b>${x.symbol}</b></td><td class="${x.direction.toLowerCase()}">${x.signal}</td><td>${x.score}</td><td>${n(x.price,6)}</td><td>${n(x.change_5m,2)}%</td><td>${n(x.rsi,1)}</td><td>${n(x.rvol,2)}x</td><td>${n(x.buy_ratio*100,0)}%</td><td>${n(x.cvd,0)}</td><td>${n(x.book_imbalance*100,1)}%</td><td>${n(x.spread_pct,3)}%</td><td>${n(x.entry,6)}</td><td>${n(x.stop,6)}</td></tr>`).join("");if(r.length){$("sc").textContent=r[0].score;$("ts").textContent=r[0].symbol;sel(0)}}
function sel(i){let x=data[i];if(!x)return;$("title").textContent=`${x.symbol} • ${x.signal} • ${x.score}/100`;$("metrics").innerHTML=[["ENTRY",n(x.entry,6)],["STOP",n(x.stop,6)],["TP1",n(x.tp1,6)],["TP2",n(x.tp2,6)],["RSI",n(x.rsi,1)],["RVOL",n(x.rvol,2)+"x"],["BUY FLOW",n(x.buy_ratio*100,1)+"%"],["CVD",n(x.cvd,0)],["BOOK",n(x.book_imbalance*100,1)+"%"],["SPREAD",n(x.spread_pct,4)+"%"],["FLOW",n(x.flow_quote,0)],["VELOCITY",n(x.trade_velocity,2)+"/s"]].map(a=>`<div class="metric"><span class="label">${a[0]}</span><b>${a[1]}</b></div>`).join("");$("reason").innerHTML="<b>Signal reasons</b><br>• "+x.reasons.join("<br>• ")}
function connect(){let p=location.protocol==="https:"?"wss":"ws",w=new WebSocket(`${p}://${location.host}/ws`);w.onopen=()=>{$("conn").textContent="LIVE";w.send("ready")};w.onclose=()=>{$("conn").textContent="RECONNECTING";setTimeout(connect,1500)};w.onmessage=e=>{let x=JSON.parse(e.data);$("reg").textContent=x.regime;$("m").textContent=x.markets;$("tm").textContent=x.time;render(x.rows)}}connect();
</script></body></html>
